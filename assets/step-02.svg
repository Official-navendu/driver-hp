<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <rect width="500" height="300" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Prepare printer (Power & Paper Deck Visual) -->
  <rect x="100" y="70" width="300" height="150" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="100" y="70" width="300" height="30" fill="#0F172A"/>
  <circle cx="130" cy="85" r="7" fill="#0096D6"/>
  
  <!-- Paper Feeding Tray Visual -->
  <rect x="160" y="30" width="180" height="50" rx="4" fill="#FFFFFF" stroke="#0096D6" stroke-width="2"/>
  <line x1="180" y1="45" x2="320" y2="45" stroke="#94A3B8" stroke-width="2"/>
  <line x1="180" y1="58" x2="280" y2="58" stroke="#94A3B8" stroke-width="2"/>

  <!-- Ink Cartridge Status Indicators -->
