  <circle cx="170" cy="160" r="12" fill="#000000"/>
  <circle cx="210" cy="160" r="12" fill="#0096D6"/>
  <circle cx="250" cy="160" r="12" fill="#EC4899"/>
  <circle cx="290" cy="160" r="12" fill="#F59E0B"/>
  <polyline points="325 152 332 160 345 148" fill="none" stroke="#059669" stroke-width="3"/>
</svg>
