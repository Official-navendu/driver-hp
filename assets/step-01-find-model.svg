<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <rect width="600" height="360" rx="8" fill="#F5F7F8" stroke="#E5E5E5" stroke-width="1.5"/>
  
  <pattern id="grid1" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E2E8F0" stroke-width="0.5"/>
  </pattern>
  <rect width="600" height="360" rx="8" fill="url(#grid1)" opacity="0.5"/>

  <!-- Printer Base Body -->
  <rect x="50" y="70" width="500" height="230" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="50" y="70" width="500" height="46" rx="8" fill="#111111"/>

  <!-- Blue HP Badge -->
  <circle cx="100" cy="140" r="22" fill="#0096D6"/>
  <text x="100" y="146" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">hp</text>

  <!-- Control Panel LCD Screen -->
  <rect x="150" y="120" width="130" height="40" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="156" y="126" width="118" height="28" rx="2" fill="#0096D6" opacity="0.2"/>
  <text x="215" y="143" font-family="monospace" font-weight="bold" font-size="11" fill="#0096D6" text-anchor="middle">LaserJet M404</text>

  <!-- Magnified Model Label Callout Badge -->
  <g transform="translate(340, 100)">
    <rect x="0" y="0" width="200" height="110" rx="6" fill="#FFFFFF" stroke="#0096D6" stroke-width="3" filter="drop-shadow(0 8px 16px rgba(0,150,214,0.12))"/>
    <rect x="12" y="12" width="176" height="24" rx="3" fill="#0096D6"/>
    <text x="100" y="28" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF" text-anchor="middle">PRINTER MODEL SPEC</text>
    
    <text x="20" y="58" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#4A4A4A">Model:</text>
    <text x="68" y="58" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="bold" font-size="12" fill="#111111">HP LaserJet M404dn</text>

    <text x="20" y="78" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#4A4A4A">Serial:</text>
    <text x="68" y="78" font-family="monospace" font-size="11" fill="#0096D6">VND3K98412</text>
    
    <rect x="20" y="90" width="160" height="8" rx="2" fill="#E2E8F0"/>
  </g>

  <!-- Dotted Connection Pointer Line -->
  <path d="M 230 140 C 280 140, 290 155, 340 155" fill="none" stroke="#0096D6" stroke-width="2.5" stroke-dasharray="5 5"/>
  <circle cx="230" cy="140" r="5" fill="#0096D6"/>
  <circle cx="340" cy="155" r="5" fill="#0096D6"/>

  <!-- Caption Bar -->
  <rect x="50" y="315" width="500" height="30" rx="4" fill="#F5F7F8" stroke="#E5E5E5"/>
  <text x="300" y="335" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="12" fill="#4A4A4A" text-anchor="middle">Step 01: Locating Model Number on Front Bezel &amp; Specification Badge</text>
</svg>
