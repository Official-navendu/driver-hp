<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <rect width="600" height="360" rx="8" fill="#F5F7F8" stroke="#E5E5E5" stroke-width="1.5"/>

  <!-- Computer Left Side -->
  <g transform="translate(40, 80)">
    <rect x="0" y="20" width="180" height="120" rx="6" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <rect x="10" y="30" width="160" height="100" fill="#0096D6" opacity="0.12"/>
    <text x="90" y="85" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="bold" font-size="12" fill="#0096D6" text-anchor="middle">Connected &amp; Ready</text>
    <path d="M -15 140 L 195 140 L 175 152 L 5 152 Z" fill="#CBD5E1"/>
  </g>

  <!-- Wi-Fi Waves Center -->
  <g transform="translate(250, 110)" stroke="#0096D6" fill="none" stroke-linecap="round">
    <path d="M 0 50 A 45 45 0 0 1 70 50" stroke-width="3.5" opacity="0.3"/>
    <path d="M 12 50 A 30 30 0 0 1 58 50" stroke-width="3.5" opacity="0.7"/>
    <path d="M 24 50 A 15 15 0 0 1 46 50" stroke-width="3.5"/>
    <circle cx="35" cy="50" r="4" fill="#0096D6"/>
    <text x="35" y="70" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="bold" font-size="10" fill="#0096D6" text-anchor="middle">2.4GHz Wi-Fi</text>
  </g>

  <!-- Printer Right Side -->
  <g transform="translate(350, 70)">
    <rect x="0" y="30" width="210" height="120" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="0" y="30" width="210" height="28" fill="#111111"/>
    
    <!-- HP Badge -->
    <circle cx="30" cy="44" r="9" fill="#0096D6"/>
    <text x="30" y="47" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="8" fill="#FFFFFF" text-anchor="middle">hp</text>

    <!-- Test Page Output Paper Sheet -->
    <g transform="translate(35, 105)">
      <rect x="0" y="0" width="140" height="75" fill="#FFFFFF" stroke="#0096D6" stroke-width="2" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.08))"/>
      <rect x="15" y="12" width="110" height="8" rx="2" fill="#0096D6"/>
      <line x1="15" y1="28" x2="125" y2="28" stroke="#4A4A4A" stroke-width="2"/>
      <line x1="15" y1="38" x2="105" y2="38" stroke="#4A4A4A" stroke-width="2"/>
      <line x1="15" y1="48" x2="115" y2="48" stroke="#059669" stroke-width="2.5"/>
      <text x="70" y="66" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="bold" font-size="8" fill="#059669" text-anchor="middle">ALIGNMENT TEST PASSED ✓</text>
    </g>
  </g>

  <!-- Caption Bar -->
  <rect x="50" y="320" width="500" height="30" rx="4" fill="#F5F7F8" stroke="#E5E5E5"/>
  <text x="300" y="340" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="12" fill="#4A4A4A" text-anchor="middle">Step 04: Wireless Connection &amp; Alignment Test Page Print Success</text>
</svg>
