<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <rect width="500" height="300" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Connect & Print Visual (Laptop + Wireless Signal + Printer Output) -->
  <g transform="translate(40, 80)">
    <rect x="0" y="30" width="150" height="95" rx="4" fill="#0F172A"/>
    <rect x="8" y="38" width="134" height="79" fill="#0096D6" opacity="0.15"/>
    <path d="M-10 125 L160 125 L145 133 L5 133 Z" fill="#CBD5E1"/>
  </g>

  <!-- Wi-Fi Wave Signals -->
  <g transform="translate(210, 115)" stroke="#0096D6" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M0 30 A30 30 0 0 1 50 30" opacity="0.4"/>
    <path d="M10 30 A20 20 0 0 1 40 30" opacity="0.7"/>
    <circle cx="25" cy="30" r="3" fill="#0096D6"/>
  </g>

  <!-- Connected Printer -->
  <g transform="translate(280, 80)">
    <rect x="0" y="20" width="170" height="90" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="0" y="20" width="170" height="20" fill="#0F172A"/>
    <polyline points="135 105 142 113 158 97" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
