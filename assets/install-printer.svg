<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" width="100%" height="100%">
  <rect x="0" y="0" width="540" height="400" fill="#FFFFFF" rx="4" stroke="#D6D6D6" stroke-width="1"/>
  
  <!-- Setup Workspace Graphic -->
  <rect x="30" y="30" width="480" height="40" rx="3" fill="#171717"/>
  <circle cx="55" cy="50" r="6" fill="#0096D6"/>
  <rect x="75" y="45" width="160" height="10" rx="2" fill="#FFFFFF"/>

  <!-- Printer Render Base -->
  <g transform="translate(60, 110)">
    <rect x="20" y="40" width="380" height="160" rx="4" fill="#F7F7F7" stroke="#D6D6D6" stroke-width="2"/>
    <rect x="20" y="40" width="380" height="30" fill="#171717"/>
    <rect x="40" y="100" width="340" height="70" rx="2" fill="#FFFFFF" stroke="#D6D6D6"/>

    <!-- Document in tray -->
    <rect x="70" y="80" width="280" height="80" fill="#FFFFFF" stroke="#0096D6" stroke-width="1.5"/>
    <line x1="90" y1="100" x2="330" y2="100" stroke="#0096D6" stroke-width="3" stroke-linecap="round"/>
    <line x1="90" y1="115" x2="290" y2="115" stroke="#555555" stroke-width="2" stroke-linecap="round"/>
    <line x1="90" y1="130" x2="250" y2="130" stroke="#999999" stroke-width="2" stroke-linecap="round"/>

    <!-- Installation Status Check Badge -->
    <circle cx="370" cy="180" r="22" fill="#0096D6"/>
    <polyline points="358 180 366 188 382 172" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
