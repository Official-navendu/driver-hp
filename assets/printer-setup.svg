<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <!-- Laptop + Wi-Fi Connection + Printer Visual -->
  <rect x="0" y="0" width="600" height="360" fill="#F5F5F5" rx="4"/>
  
  <!-- Laptop SVG -->
  <g transform="translate(60, 100)">
    <rect x="20" y="20" width="160" height="105" rx="4" fill="#111111" stroke="#5A5A5A" stroke-width="2"/>
    <rect x="28" y="28" width="144" height="89" fill="#0096D6" opacity="0.1"/>
    <!-- Laptop screen content lines -->
    <rect x="40" y="45" width="80" height="8" rx="2" fill="#0096D6"/>
    <rect x="40" y="60" width="120" height="4" rx="1" fill="#5A5A5A"/>
    <rect x="40" y="70" width="90" height="4" rx="1" fill="#5A5A5A"/>
    <!-- Laptop Base -->
    <path d="M0 125 L200 125 L180 135 L20 135 Z" fill="#D9D9D9" stroke="#5A5A5A" stroke-width="1.5"/>
  </g>

  <!-- Wi-Fi Signal Waves -->
  <g transform="translate(270, 140)" stroke="#0096D6" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M0 40 A40 40 0 0 1 60 40" opacity="0.3"/>
    <path d="M10 40 A30 30 0 0 1 50 40" opacity="0.6"/>
    <path d="M20 40 A20 20 0 0 1 40 40"/>
    <circle cx="30" cy="40" r="3" fill="#0096D6"/>
  </g>

  <!-- Printer SVG -->
  <g transform="translate(360, 110)">
    <rect x="10" y="30" width="170" height="85" rx="4" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="2"/>
    <rect x="10" y="30" width="170" height="20" fill="#111111"/>
    <rect x="25" y="65" width="140" height="35" rx="2" fill="#F5F5F5" stroke="#D9D9D9"/>
    <!-- Printed Document -->
    <rect x="45" y="55" width="100" height="45" fill="#FFFFFF" stroke="#0096D6" stroke-width="1.5"/>
    <line x1="55" y1="65" x2="125" y2="65" stroke="#0096D6" stroke-width="2"/>
    <line x1="55" y1="75" x2="105" y2="75" stroke="#5A5A5A" stroke-width="1.5"/>
  </g>
</svg>
