<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" height="100%">
  <defs>
    <!-- Subtle Background Stripe Gradient -->
    <linearGradient id="stripeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0096D6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0096D6" stop-opacity="0.02"/>
    </linearGradient>
    <!-- Solid Electric Blue -->
    <linearGradient id="electricBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0096D6"/>
      <stop offset="100%" stop-color="#0077B5"/>
    </linearGradient>
    <!-- Soft Shadow Filter -->
    <filter id="printerShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Decorative Blue Stripes (HP Brand Language) -->
  <path d="M450 -50 L580 -50 L400 550 L270 550 Z" fill="url(#stripeGrad)"/>
  <path d="M590 -50 L650 -50 L470 550 L410 550 Z" fill="url(#stripeGrad)"/>
  <path d="M380 420 L680 420 L680 424 L380 424 Z" fill="#0096D6" opacity="0.3"/>

  <!-- Light Gray Product Stage Backdrop -->
  <rect x="60" y="80" width="580" height="340" rx="4" fill="#F5F5F5"/>

  <!-- Printer Render Group -->
  <g filter="url(#printerShadow)">
    <!-- Base Shadow -->
    <ellipse cx="350" cy="380" rx="230" ry="16" fill="#000000" opacity="0.15"/>

    <!-- Printer Base Housing -->
    <rect x="140" y="200" width="420" height="170" rx="6" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="2"/>
    
    <!-- Dark Front Accent Panel -->
    <rect x="140" y="200" width="420" height="36" fill="#111111"/>

    <!-- Control Display Panel & Touchscreen -->
    <rect x="165" y="206" width="90" height="24" rx="2" fill="#222222" stroke="#333333"/>
    <rect x="170" y="210" width="45" height="16" rx="1" fill="#0096D6"/>
    <circle cx="235" cy="218" r="4" fill="#FFFFFF"/>

    <!-- Output Paper Slot & Tray -->
    <rect x="180" y="260" width="340" height="70" rx="3" fill="#F5F5F5" stroke="#D9D9D9" stroke-width="1.5"/>
    <rect x="210" y="280" width="280" height="70" rx="2" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/>

    <!-- Printed Document Page Output -->
    <rect x="240" y="250" width="220" height="85" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/>
    <!-- Printed Text Lines -->
    <line x1="260" y1="270" x2="420" y2="270" stroke="#0096D6" stroke-width="4" stroke-linecap="round"/>
    <line x1="260" y1="285" x2="390" y2="285" stroke="#5A5A5A" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="260" y1="297" x2="360" y2="297" stroke="#5A5A5A" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="260" y1="309" x2="400" y2="309" stroke="#999999" stroke-width="2" stroke-linecap="round"/>

    <!-- Scanner / Top Deck -->
    <path d="M170 200 L200 130 L500 130 L530 200 Z" fill="#FAFAFA" stroke="#D9D9D9" stroke-width="2"/>
    <rect x="220" y="115" width="260" height="25" rx="3" fill="#FFFFFF" stroke="#0096D6" stroke-width="2"/>
    
    <!-- Electric Blue Accent Stripe on Body -->
    <rect x="140" y="234" width="420" height="4" fill="url(#electricBlue)"/>

    <!-- Support Brand Badge -->
    <rect x="505" y="325" width="40" height="30" rx="2" fill="#F5F5F5" stroke="#D9D9D9"/>
    <circle cx="525" cy="340" r="10" fill="#0096D6"/>
    <path d="M520 335 L523 345 M524 335 L527 345" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
