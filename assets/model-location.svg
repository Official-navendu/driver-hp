<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="100%">
  <rect x="0" y="0" width="540" height="320" fill="#F7F7F7" rx="4" stroke="#D6D6D6" stroke-width="1"/>
  
  <!-- Printer Front Frame Diagram -->
  <rect x="40" y="50" width="240" height="180" rx="4" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="2"/>
  <rect x="40" y="50" width="240" height="36" fill="#171717"/>
  
  <!-- Highlighted Model Badge Location Box -->
  <rect x="65" y="100" width="120" height="28" rx="2" fill="#0096D6" fill-opacity="0.15" stroke="#0096D6" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="125" y="118" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#0096D6" text-anchor="middle">MODEL LABEL</text>
  
  <!-- Callout Pointer Arrow Line -->
  <path d="M185 114 L320 114" stroke="#0096D6" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="320" cy="114" r="4" fill="#0096D6"/>

  <!-- Product Label Callout Card -->
  <rect x="330" y="65" width="180" height="150" rx="3" fill="#FFFFFF" stroke="#0096D6" stroke-width="2"/>
  <rect x="340" y="75" width="160" height="20" fill="#171717"/>
  <text x="420" y="89" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PRINTER SPECIFICATION</text>

  <text x="350" y="118" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555555">Model Name:</text>
  <text x="350" y="138" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0096D6">HP LaserJet Pro M404dn</text>

  <text x="350" y="165" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#999999">Product No: W1A53A</text>
  <text x="350" y="182" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#999999">Serial No: VNB3K98765</text>
  <line x1="350" y1="195" x2="490" y2="195" stroke="#E0E0E0" stroke-width="1"/>
  <text x="350" y="207" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#0096D6">Found near control panel or rear label</text>
</svg>
