<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="heroSh" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="8" fill="url(#heroBg)" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Printer Render -->
  <g filter="url(#heroSh)">
    <ellipse cx="300" cy="330" rx="200" ry="14" fill="#0F172A" opacity="0.12"/>
    <rect x="120" y="160" width="360" height="150" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="120" y="160" width="360" height="32" fill="#0F172A"/>
    <rect x="145" y="167" width="80" height="18" rx="2" fill="#1E293B"/>
    <rect x="150" y="171" width="40" height="10" rx="1" fill="#0096D6"/>

    <!-- Paper Output Tray -->
    <rect x="150" y="215" width="300" height="65" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="175" y="235" width="250" height="60" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>

    <!-- Document Output -->
    <rect x="200" y="200" width="200" height="75" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="220" y1="218" x2="380" y2="218" stroke="#0096D6" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="220" y1="230" x2="340" y2="230" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <line x1="220" y1="242" x2="310" y2="242" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>

    <!-- Top Deck -->
    <path d="M150 160 L180 100 L420 100 L450 160 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="200" y="85" width="200" height="22" rx="2" fill="#FFFFFF" stroke="#0096D6" stroke-width="2"/>
    <rect x="120" y="192" width="360" height="3" fill="#0096D6"/>
  </g>
</svg>
