<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="100%" height="100%">
  <rect width="540" height="380" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  
  <!-- Laptop Visual Left -->
  <g transform="translate(30, 80)">
    <rect x="10" y="20" width="240" height="150" rx="4" fill="#0F172A" stroke="#475569" stroke-width="2"/>
    <rect x="20" y="30" width="220" height="130" fill="#FFFFFF"/>
    
    <!-- Software Wizard UI on Laptop -->
    <rect x="20" y="30" width="220" height="25" fill="#F8FAFC" stroke="#CBD5E1"/>
    <circle cx="35" cy="42.5" r="7" fill="#0096D6"/>
    <text x="35" y="45" font-family="-apple-system, sans-serif" font-weight="900" font-size="7" fill="#FFFFFF" text-anchor="middle">hp</text>
    <text x="50" y="46" font-family="-apple-system, sans-serif" font-weight="bold" font-size="9" fill="#0F172A">Driver Setup</text>

    <!-- Step Flow Diagram inside Laptop Screen -->
    <circle cx="70" cy="95" r="12" fill="#0096D6"/>
    <line x1="82" y1="95" x2="118" y2="95" stroke="#0096D6" stroke-width="2"/>
    <circle cx="130" cy="95" r="12" fill="#0096D6"/>
    <line x1="142" y1="95" x2="178" y2="95" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="190" cy="95" r="12" fill="#E2E8F0"/>

    <rect x="50" y="125" width="160" height="10" rx="5" fill="#E2E8F0"/>
    <rect x="50" y="125" width="100" height="10" rx="5" fill="#0096D6"/>

    <!-- Base -->
    <path d="M-10 170 L270 170 L250 182 L10 182 Z" fill="#CBD5E1"/>
  </g>

  <!-- Connected HP Printer Visual Right -->
  <g transform="translate(300, 100)">
    <rect x="0" y="20" width="200" height="110" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="0" y="20" width="200" height="24" fill="#0F172A"/>
    <circle cx="100" cy="65" r="12" fill="#0096D6"/>
    <text x="100" y="69" font-family="-apple-system, sans-serif" font-weight="900" font-size="10" fill="#FFFFFF" text-anchor="middle">hp</text>
  </g>
</svg>
