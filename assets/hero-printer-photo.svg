<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 420" width="100%" height="100%">
  <defs>
    <linearGradient id="wallBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="woodDesk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="printerSh" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Wall & Desk Background -->
  <rect x="0" y="0" width="650" height="320" fill="url(#wallBg)"/>
  <rect x="0" y="320" width="650" height="100" fill="url(#woodDesk)"/>
  <line x1="0" y1="320" x2="650" y2="320" stroke="#94A3B8" stroke-width="2"/>

  <!-- Potted Plant on Desk (Left Side Background) -->
  <g transform="translate(40, 200)">
    <path d="M15 80 L35 80 L40 120 L10 120 Z" fill="#64748B"/>
    <!-- Plant Leaves -->
    <path d="M25 80 C 10 50, -10 30, -5 10 C 15 20, 20 50, 25 80 Z" fill="#15803D"/>
    <path d="M25 80 C 35 40, 50 20, 55 5 C 40 25, 30 55, 25 80 Z" fill="#166534"/>
    <path d="M25 80 C 0 60, -20 65, -30 50 C -15 45, 10 60, 25 80 Z" fill="#22C55E"/>
  </g>

  <!-- Office Setup Details (Right Side Paper Stack) -->
  <g transform="translate(540, 270)">
    <rect x="0" y="20" width="80" height="30" rx="2" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="5" y="10" width="80" height="30" rx="2" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="10" y="0" width="80" height="30" rx="2" fill="#FFFFFF" stroke="#0096D6"/>
    <line x1="20" y1="10" x2="70" y2="10" stroke="#0096D6" stroke-width="2"/>
    <line x1="20" y1="18" x2="60" y2="18" stroke="#94A3B8" stroke-width="1.5"/>
  </g>

  <!-- Main Realistic HP Printer Render -->
  <g filter="url(#printerSh)" transform="translate(100, 60)">
    <!-- Base Shadow -->
    <ellipse cx="230" cy="270" rx="210" ry="16" fill="#0F172A" opacity="0.15"/>

    <!-- Main White Printer Housing -->
    <rect x="30" y="90" width="400" height="170" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="30" y="90" width="400" height="36" fill="#0F172A"/>

    <!-- Touchscreen Display -->
    <rect x="55" y="98" width="90" height="22" rx="2" fill="#1E293B"/>
    <rect x="60" y="102" width="45" height="14" rx="1" fill="#0096D6"/>
    <circle cx="130" cy="109" r="3" fill="#FFFFFF"/>

    <!-- Paper Output Tray -->
    <rect x="60" y="150" width="340" height="70" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="90" y="170" width="280" height="70" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>

    <!-- Printed Color Document Output -->
    <rect x="120" y="135" width="220" height="85" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <!-- Color Bar Header & Document Text -->
    <rect x="135" y="148" width="190" height="16" fill="#0096D6"/>
    <rect x="135" y="170" width="100" height="30" fill="#3B82F6" opacity="0.2"/>
    <rect x="245" y="170" width="80" height="30" fill="#10B981" opacity="0.2"/>
    <line x1="135" y1="208" x2="315" y2="208" stroke="#475569" stroke-width="2"/>

    <!-- Scanner / Top Lid Deck -->
    <path d="M60 90 L90 20 L370 20 L400 90 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="110" y="5" width="240" height="22" rx="2" fill="#FFFFFF" stroke="#0096D6" stroke-width="2"/>

    <!-- HP Logo Badge on Front Body -->
    <circle cx="230" cy="132" r="12" fill="#0096D6"/>
    <text x="230" y="136" font-family="-apple-system, sans-serif" font-weight="900" font-size="10" fill="#FFFFFF" text-anchor="middle">hp</text>
  </g>
</svg>
