<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="100%" height="100%">
  <rect width="520" height="300" rx="8" fill="#FFF5F5" stroke="#FEE2E2" stroke-width="1"/>
  
  <!-- Printer with Warning Badge ! -->
  <g transform="translate(100, 50)">
    <rect x="20" y="60" width="280" height="130" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="20" y="60" width="280" height="28" fill="#0F172A"/>

    <!-- Output Tray -->
    <rect x="50" y="120" width="220" height="50" rx="2" fill="#F8FAFC" stroke="#CBD5E1"/>

    <!-- Red Error Warning Circle Badge (!) -->
    <circle cx="240" cy="110" r="28" fill="#EF4444" stroke="#FFFFFF" stroke-width="3"/>
    <text x="240" y="122" font-family="-apple-system, sans-serif" font-weight="900" font-size="32" fill="#FFFFFF" text-anchor="middle">!</text>
  </g>

  <!-- Potted Plant Right -->
  <g transform="translate(420, 160)">
    <path d="M10 70 L30 70 L35 110 L5 110 Z" fill="#64748B"/>
    <path d="M20 70 C 10 40, -10 20, -5 0 C 15 10, 20 40, 20 70 Z" fill="#15803D"/>
    <path d="M20 70 C 30 30, 45 10, 50 -5 C 35 15, 25 45, 20 70 Z" fill="#166534"/>
  </g>
</svg>
