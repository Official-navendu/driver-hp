<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="100%" height="100%">
  <rect x="0" y="0" width="500" height="240" fill="#F5F5F5" rx="4"/>
  
  <!-- Printer Front Diagram -->
  <rect x="40" y="40" width="220" height="150" rx="4" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="2"/>
  <rect x="40" y="40" width="220" height="30" fill="#111111"/>
  
  <!-- Highlighted Model Badge area -->
  <rect x="60" y="80" width="100" height="24" rx="2" fill="#0096D6" fill-opacity="0.15" stroke="#0096D6" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="110" y="96" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0096D6" text-anchor="middle">MODEL LABEL</text>
  
  <!-- Pointer Arrow -->
  <path d="M165 92 L300 92" stroke="#0096D6" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="300" cy="92" r="4" fill="#0096D6"/>

  <!-- Product Label Callout -->
  <rect x="310" y="55" width="160" height="110" rx="3" fill="#FFFFFF" stroke="#0096D6" stroke-width="2"/>
  <rect x="320" y="65" width="140" height="16" fill="#111111"/>
  <text x="390" y="77" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PRINTER SUPPORT</text>

  <text x="330" y="105" font-family="Arial, sans-serif" font-size="10" fill="#5A5A5A">Model / Product No:</text>
  <text x="330" y="125" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0096D6">HP LaserJet Pro M404dn</text>
  <text x="330" y="145" font-family="Arial, sans-serif" font-size="9" fill="#999999">Serial No: CNB1234567</text>
</svg>
