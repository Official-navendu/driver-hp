<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <rect x="0" y="0" width="640" height="400" fill="#F7F7F7" rx="4" stroke="#D6D6D6" stroke-width="1"/>
  
  <!-- Laptop Visual -->
  <g transform="translate(70, 110)">
    <rect x="20" y="20" width="180" height="120" rx="4" fill="#171717" stroke="#555555" stroke-width="2"/>
    <rect x="30" y="30" width="160" height="100" fill="#0096D6" opacity="0.1"/>
    <!-- Laptop screen UI -->
    <rect x="45" y="48" width="90" height="10" rx="2" fill="#0096D6"/>
    <rect x="45" y="66" width="130" height="5" rx="1" fill="#555555"/>
    <rect x="45" y="77" width="100" height="5" rx="1" fill="#555555"/>
    <rect x="45" y="88" width="70" height="5" rx="1" fill="#999999"/>
    <!-- Laptop Base -->
    <path d="M0 140 L220 140 L195 152 L25 152 Z" fill="#D6D6D6" stroke="#555555" stroke-width="1.5"/>
  </g>

  <!-- Connection Wave Arrows -->
  <g transform="translate(290, 160)" stroke="#0096D6" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M0 45 A45 45 0 0 1 65 45" opacity="0.3"/>
    <path d="M12 45 A32 32 0 0 1 53 45" opacity="0.6"/>
    <path d="M22 45 A20 20 0 0 1 43 45"/>
    <circle cx="32.5" cy="45" r="3.5" fill="#0096D6"/>
  </g>

  <!-- Printer Visual -->
  <g transform="translate(390, 120)">
    <rect x="10" y="35" width="190" height="95" rx="4" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="2"/>
    <rect x="10" y="35" width="190" height="22" fill="#171717"/>
    <rect x="30" y="75" width="150" height="40" rx="2" fill="#F7F7F7" stroke="#D6D6D6"/>
    <!-- Document -->
    <rect x="50" y="60" width="110" height="55" fill="#FFFFFF" stroke="#0096D6" stroke-width="1.5"/>
    <line x1="62" y1="72" x2="142" y2="72" stroke="#0096D6" stroke-width="2.5"/>
    <line x1="62" y1="84" x2="122" y2="84" stroke="#555555" stroke-width="1.5"/>
  </g>
</svg>
