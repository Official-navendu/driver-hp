<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <rect width="600" height="360" rx="8" fill="#F5F7F8" stroke="#E5E5E5" stroke-width="1.5"/>

  <!-- Main Frame -->
  <rect x="40" y="50" width="520" height="260" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  
  <!-- Open Printer Door Top Angle -->
  <path d="M 40 110 L 140 30 L 460 30 L 560 110 Z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
  <line x1="140" y1="30" x2="460" y2="30" stroke="#0096D6" stroke-width="3"/>

  <!-- Cartridge Slot Chamber -->
  <rect x="120" y="130" width="360" height="100" rx="6" fill="#0F172A"/>
  
  <!-- Cartridge Sliding Rails -->
  <line x1="140" y1="180" x2="460" y2="180" stroke="#334155" stroke-width="4"/>

  <!-- High Detail Ink/Toner Cartridge Unit Being Inserted -->
  <g transform="translate(200, 110)">
    <rect x="0" y="0" width="200" height="75" rx="6" fill="#111111" stroke="#0096D6" stroke-width="2.5" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.15))"/>
    <rect x="15" y="15" width="40" height="45" rx="3" fill="#0096D6"/>
    <text x="35" y="42" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle">BK</text>
    
    <!-- Orange Tape Removal Indicator -->
    <path d="M 120 10 L 180 -15" stroke="#F97316" stroke-width="4" stroke-dasharray="4 2"/>
    <rect x="170" y="-30" width="28" height="20" rx="2" fill="#F97316"/>
    <text x="184" y="-16" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="bold" font-size="10" fill="#FFFFFF" text-anchor="middle">PULL</text>
  </g>

  <!-- Paper Input Tray Loading at Bottom -->
  <rect x="160" y="245" width="280" height="45" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="180" y="235" width="240" height="20" rx="2" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="300" y="250" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Plain Paper Stack Loaded (Letter / A4)</text>

  <!-- Caption Bar -->
  <rect x="40" y="320" width="520" height="30" rx="4" fill="#F5F7F8" stroke="#E5E5E5"/>
  <text x="300" y="340" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="12" fill="#4A4A4A" text-anchor="middle">Step 02: Hardware Preparation — Inserting Cartridges &amp; Loading Paper</text>
</svg>
